<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log a set</title>
<script src="./dc-lite.js"></script>
<style>html,body{margin:0;background:#2b2b2d;min-height:100vh;display:flex;align-items:center;justify-content:center}.dc-root{border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter Tight',system-ui,sans-serif;color:#1C1C1E}
a{color:#1C1C1E;text-decoration:none}a:hover{color:#000000}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Inter Tight', system-ui, sans-serif; color: #1C1C1E; background: radial-gradient(95% 26% at 50% 22%, #F6CFB2 0%, rgba(246,207,178,0) 72%), linear-gradient(180deg, #C9D6E8 0%, #E1E7F0 22%, #F2F2F0 46%, #F2F2F0 100%)">
  <div style="padding: 52px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="02-workout-overview.html" aria-label="Close workout" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
      <div aria-label="Exercise 1 of 5" style="display: flex; gap: 5px">
        <span style="width: 20px; height: 4px; border-radius: 2px; background: #1C1C1E"></span>
        <span style="width: 20px; height: 4px; border-radius: 2px; background: rgba(28,28,30,0.18)"></span>
        <span style="width: 20px; height: 4px; border-radius: 2px; background: rgba(28,28,30,0.18)"></span>
        <span style="width: 20px; height: 4px; border-radius: 2px; background: rgba(28,28,30,0.18)"></span>
        <span style="width: 20px; height: 4px; border-radius: 2px; background: rgba(28,28,30,0.18)"></span>
      </div>
      <a href="05-cues-notes.html" style="height: 44px; padding: 0 18px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; font-size: 14px; font-weight: 600">Cues</a>
    </div>

    <h1 style="margin: 6px 4px 0; font-family: 'Newsreader', Georgia, serif; font-size: 32px; line-height: 1.1; font-weight: 400; letter-spacing: -0.01em">Leg Press. <span style="color: #6E6E73">Set 2 of 4.</span></h1>
    <p style="margin: 0 4px; font-size: 14px; line-height: 1.4; color: #6E6E73">Slow and controlled 3-sec negatives with 1-sec pause at contraction.</p>

    <div style="display: flex; flex-direction: column; gap: 4px">
    <button type="button" aria-expanded="{{ expandedAttr }}" aria-controls="history" onClick="{{ toggle }}" style="display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 10px 12px 10px 20px; border-radius: 22px; border: none; background: #FBE7DA; color: #1C1C1E; text-align: left; cursor: pointer; font-family: inherit">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #5A4A40">Brenna's target · from your coaching doc</span>
        <span style="font-size: 16px; font-weight: 500">8 reps · rest 2:00 · <span style="color: #5A4A40; font-weight: 400">no weight set</span></span>
      </span>
      <span style="width: 36px; height: 36px; flex: none; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="{{ chevron }}"><path d="M6 9l6 6 6-6"/></svg></span>
    </button>

    <sc-if value="{{ expanded }}" hint-placeholder-val="{{ false }}">
      <div id="history" role="list" aria-label="Past Leg Press sessions" style="display: flex; flex-direction: column; gap: 4px">
        <sc-for list="{{ history }}" as="h" hint-placeholder-count="3">
          <div role="listitem" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 20px; border-radius: 22px; background: #FFFFFF">
            <span style="font-size: 13px; color: #6E6E73">{{ h.date }}</span>
            <span style="font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums">{{ h.sets }}</span>
          </div>
        </sc-for>
        <span style="margin: 2px 4px 0; font-size: 12px; color: #6E6E73">Tap Brenna's target again to return to today's sets</span>
      </div>
    </sc-if>
    <sc-if value="{{ collapsed }}" hint-placeholder-val="{{ true }}">
    <div role="list" aria-label="Sets" style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
        <div role="listitem" style="{{ r.rowStyle }}">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 13px; color: #6E6E73">Set {{ r.n }} · last {{ r.last }}</span>
            <span style="font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums">{{ r.today }}</span>
          </div>
          <span style="{{ r.tickStyle }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>
        </div>
      </sc-for>
    </div>
    </sc-if>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 20px 34px; background: #FFFFFF; border-radius: 32px 32px 0 0; box-shadow: 0 -8px 30px rgba(28,28,30,0.06); display: flex; flex-direction: column; gap: 16px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 6px; align-items: center">
        <label for="weight" style="font-size: 13px; color: #6E6E73">Weight, kg</label>
        <input id="weight" type="text" inputmode="decimal" value="62.5" style="width: 100%; height: 52px; box-sizing: border-box; border-radius: 26px; border: none; background: #F1F1EF; color: #1C1C1E; font-family: inherit; font-size: 28px; font-weight: 500; text-align: center; font-variant-numeric: tabular-nums">
        <span style="font-size: 11px; color: #6E6E73">Tap to type</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; align-items: center">
        <label for="reps" style="font-size: 13px; color: #6E6E73">Reps</label>
        <input id="reps" type="text" inputmode="numeric" value="8" style="width: 100%; height: 52px; box-sizing: border-box; border-radius: 26px; border: none; background: #F1F1EF; color: #1C1C1E; font-family: inherit; font-size: 28px; font-weight: 500; text-align: center; font-variant-numeric: tabular-nums">
        <span style="font-size: 11px; color: #6E6E73">Tap to type</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #6E6E73">Reps left in the tank</span>
      <div role="radiogroup" aria-label="Reps in reserve" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{ rirs }}" as="o" hint-placeholder-count="4">
          <button type="button" role="radio" aria-checked="{{ o.checked }}" onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button>
        </sc-for>
      </div>
    </div>

    <a href="04-rest-timer.html" style="height: 60px; border-radius: 30px; background: #1C1C1E; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center">Log set 2</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { weight: 62.5, reps: 8, rir: '2', expanded: false };
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var rowBase = 'display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 8px 20px; border-radius: 22px;';
    var data = [
      ['1', '60 × 8', '62.5 kg × 8 · RIR 2', 'done'],
      ['2', '60 × 8', 'In progress', 'active'],
      ['3', '62.5 × 7', '—', 'todo'],
      ['4', '62.5 × 7', '—', 'todo']
    ];
    var rows = data.map(function (d) {
      return {
        n: d[0], last: d[1], today: d[2],
        rowStyle: rowBase + (d[3] === 'active' ? 'background: #FFFFFF; box-shadow: 0 0 0 1.5px #1C1C1E inset;' : d[3] === 'done' ? 'background: #FFFFFF;' : 'background: rgba(255,255,255,0.55);'),
        tickStyle: 'width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; ' + (d[3] === 'done' ? 'background: #F6CFB2; color: #1C1C1E;' : 'color: transparent;')
      };
    });
    var chip = 'height: 48px; border-radius: 24px; border: none; font-size: 16px; font-weight: 600; cursor: pointer;';
    var rirs = ['0', '1', '2', '3+'].map(function (v) {
      var on = s.rir === v;
      return {
        label: v, checked: on ? 'true' : 'false',
        style: chip + (on ? 'background: #1C1C1E; color: #FFFFFF;' : 'background: #F1F1EF; color: #1C1C1E;'),
        pick: function () { self.setState({ rir: v }); }
      };
    });
    return {
      weight: s.weight % 1 === 0 ? String(s.weight) : s.weight.toFixed(1),
      reps: s.reps,
      rows: rows,
      rirs: rirs,
      expanded: s.expanded,
      collapsed: !s.expanded,
      expandedAttr: s.expanded ? 'true' : 'false',
      chevron: s.expanded ? 'transform: rotate(180deg);' : '',
      toggle: function () { self.setState({ expanded: !s.expanded }); },
      history: [
        { date: 'Thu 19 Nov · last session', sets: '60 × 8 · 60 × 8 · 62.5 × 7 · 62.5 × 7' },
        { date: 'Thu 12 Nov', sets: '60 × 8 · 60 × 8 · 60 × 7 · 60 × 7' },
        { date: 'Thu 5 Nov', sets: '57.5 × 8 · 57.5 × 8 · 60 × 7 · 60 × 6' },
        { date: 'Thu 29 Oct', sets: '57.5 × 8 · 57.5 × 8 · 57.5 × 8 · 57.5 × 7' }
      ],
      wUp: function () { self.setState({ weight: s.weight + 2.5 }); },
      wDown: function () { self.setState({ weight: Math.max(0, s.weight - 2.5) }); },
      rUp: function () { self.setState({ reps: s.reps + 1 }); },
      rDown: function () { self.setState({ reps: Math.max(0, s.reps - 1) }); }
    };
  }
}
</script>
</body>
</html>
