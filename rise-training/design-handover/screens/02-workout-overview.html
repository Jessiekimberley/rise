<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Day 1 Lower body</title>
<script src="./dc-lite.js"></script>
<style>html,body{margin:0;background:#2b2b2d;min-height:100vh;display:flex;align-items:center;justify-content:center}.dc-root{border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter Tight',system-ui,sans-serif;color:#1C1C1E}
a{color:#1C1C1E;text-decoration:none}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Inter Tight', system-ui, sans-serif; color: #1C1C1E; background: radial-gradient(95% 30% at 50% 26%, #F6CFB2 0%, rgba(246,207,178,0) 72%), linear-gradient(180deg, #C9D6E8 0%, #E1E7F0 26%, #F2F2F0 52%, #F2F2F0 100%)">
  <div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <a href="01-today.html" aria-label="Back to Today" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>

    <h1 style="margin: 4px 4px 6px; font-family: 'Newsreader', Georgia, serif; font-size: 34px; line-height: 1.1; font-weight: 400; letter-spacing: -0.01em">Lower body. <span style="color: #6E6E73">Day 1, last done Thursday 19 Nov.</span></h1>

    <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{ exercises }}" as="ex" hint-placeholder-count="5">
        <li style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 12px 12px 20px; border-radius: 24px; background: #FFFFFF">
          <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <span style="font-size: 13px; color: #6E6E73">{{ ex.plan }}</span>
            <span style="font-size: 17px; font-weight: 500">{{ ex.name }}</span>
          </div>
          <span style="{{ ex.pillStyle }}">{{ ex.last }}</span>
        </li>
      </sc-for>
    </ol>
    <span style="margin: 0 4px; font-size: 12px; color: #6E6E73">Right side shows your last session</span>
  </div>

  <a href="03-log-set.html" style="position: absolute; left: 20px; right: 20px; bottom: 100px; height: 60px; border-radius: 30px; background: #1C1C1E; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center">Begin with Leg Press</a>

  <nav aria-label="Main" style="position: absolute; left: 24px; right: 24px; bottom: 20px; height: 64px; border-radius: 32px; background: rgba(255,255,255,0.9); box-shadow: 0 6px 24px rgba(28,28,30,0.10); display: flex; justify-content: space-around; align-items: center">
    <a href="01-today.html" aria-label="Today" style="width: 48px; height: 48px; border-radius: 24px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"/></svg></a>
    <a href="02-workout-overview.html" aria-label="Train" aria-current="page" style="width: 48px; height: 48px; border-radius: 24px; background: #1C1C1E; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 7v10M3 10v4M18 7v10M21 10v4M6 12h12"/></svg></a>
    <a href="07-daily-habits.html" aria-label="Habits" style="width: 48px; height: 48px; border-radius: 24px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg></a>
    <a href="08-strength-progress.html" aria-label="Progress" style="width: 48px; height: 48px; border-radius: 24px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M6 15l4-4 3 3 6-7"/></svg></a>
    <a href="09-check-in.html" aria-label="Check-in" style="width: 48px; height: 48px; border-radius: 24px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var pill = 'flex: none; height: 40px; padding: 0 14px; border-radius: 20px; display: flex; align-items: center; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;';
    var list = [
      ['Leg Press', '4 × 8 · rest 2:00', '62.5 × 7'],
      ['RDL · Barbell', '3 × 8–10 · rest 2:00', '40 × 10'],
      ['Leg extensions', '3 × 12 · rest 1:30', '25 × 12'],
      ['Walking lunges', '3 × 10 per leg · rest 2:00', '2 × 8 kg'],
      ['Forearm plank', '3 × 30 s–1 min · rest 1:00', '45 s']
    ];
    return {
      exercises: list.map(function (e, i) {
        return { name: e[0], plan: e[1], last: e[2], pillStyle: pill + (i === 0 ? 'background: #1C1C1E; color: #FFFFFF;' : 'background: #F1F1EF; color: #1C1C1E;') };
      })
    };
  }
}
</script>
</body>
</html>
