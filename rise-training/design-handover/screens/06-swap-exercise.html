<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swap exercise</title>
<script src="./dc-lite.js"></script>
<style>html,body{margin:0;background:#2b2b2d;min-height:100vh;display:flex;align-items:center;justify-content:center}.dc-root{border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter Tight',system-ui,sans-serif;color:#1C1C1E}
a{color:#1C1C1E;text-decoration:none}a:hover{color:#000000}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Inter Tight', system-ui, sans-serif; color: #1C1C1E; background: radial-gradient(95% 28% at 50% 24%, #F6CFB2 0%, rgba(246,207,178,0) 72%), linear-gradient(180deg, #C9D6E8 0%, #E1E7F0 24%, #F2F2F0 50%, #F2F2F0 100%)">
  <div aria-hidden="true" style="padding: 118px 24px 0">
    <span style="font-family: 'Newsreader', Georgia, serif; font-size: 34px; line-height: 1.1">RDL. <span style="color: #6E6E73">Barbell, 3 sets of 8–10, rest 2:00.</span></span>
  </div>
  <a href="05-cues-notes.html" aria-label="Close swap" style="position: absolute; inset: 0; background: rgba(28, 28, 30, 0.32)"></a>

  <div role="dialog" aria-label="Swap RDL" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 34px; background: #FFFFFF; border-radius: 32px 32px 0 0; display: flex; flex-direction: column; gap: 18px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #E2E1DD"></span>
    <h1 style="margin: 4px 4px 0; font-family: 'Newsreader', Georgia, serif; font-size: 28px; line-height: 1.15; font-weight: 400">Swap RDL. <span style="color: #6E6E73">Options from Brenna's programme, same sets, reps and rest.</span></h1>

    <div role="radiogroup" aria-label="Equipment" style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{ opts }}" as="o" hint-placeholder-count="2">
        <button type="button" role="radio" aria-checked="{{ o.checked }}" onClick="{{ o.pick }}" style="{{ o.style }}">
          <span style="display: flex; flex-direction: column; gap: 3px; align-items: flex-start">
            <span style="font-size: 13px; color: #6E6E73">{{ o.sub }}</span>
            <span style="font-size: 17px; font-weight: 500">{{ o.name }}</span>
          </span>
          <span style="{{ o.dot }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>
        </button>
      </sc-for>
    </div>

    <div role="radiogroup" aria-label="Apply to" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{ scopes }}" as="s" hint-placeholder-count="2">
        <button type="button" role="radio" aria-checked="{{ s.checked }}" onClick="{{ s.pick }}" style="{{ s.style }}">{{ s.label }}</button>
      </sc-for>
    </div>

    <p style="margin: 0 4px; font-size: 13px; line-height: 1.4; color: #6E6E73">Need something not listed? <a href="sms:0272998327" style="font-weight: 600; text-decoration: underline">Ask Brenna</a> before changing your plan.</p>

    <a href="05-cues-notes.html" style="height: 60px; border-radius: 30px; background: #1C1C1E; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center">Use {{ chosen }}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 'Dumbbells', scope: 'today' };
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var row = 'display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px 12px 12px 20px; border-radius: 24px; border: none; text-align: left; color: #1C1C1E; cursor: pointer; box-sizing: border-box;';
    var opts = [
      { name: 'Barbell', sub: 'Current · last 40 kg × 10' },
      { name: 'Dumbbells', sub: 'Tracked separately' }
    ].map(function (o) {
      var on = s.pick === o.name;
      return {
        name: o.name, sub: o.sub, checked: on ? 'true' : 'false',
        style: row + (on ? 'background: #FBE7DA;' : 'background: #F4F4F2;'),
        dot: 'width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: #1C1C1E; color: #FFFFFF;' : 'background: #FFFFFF; color: transparent;'),
        pick: function () { self.setState({ pick: o.name }); }
      };
    });
    var chip = 'height: 46px; border-radius: 23px; border: none; font-size: 15px; font-weight: 600; cursor: pointer;';
    var scopes = [['today', 'Today only'], ['always', 'Every Day 1']].map(function (x) {
      var on = s.scope === x[0];
      return {
        label: x[1], checked: on ? 'true' : 'false',
        style: chip + (on ? 'background: #1C1C1E; color: #FFFFFF;' : 'background: #F1F1EF; color: #1C1C1E;'),
        pick: function () { self.setState({ scope: x[0] }); }
      };
    });
    return { opts: opts, scopes: scopes, chosen: s.pick.toLowerCase() };
  }
}
</script>
</body>
</html>
