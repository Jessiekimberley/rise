<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily habits</title>
<script src="./dc-lite.js"></script>
<style>html,body{margin:0;background:#2b2b2d;min-height:100vh;display:flex;align-items:center;justify-content:center}.dc-root{border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter Tight',system-ui,sans-serif;color:#1C1C1E}
a{color:#1C1C1E;text-decoration:none}a:hover{color:#000000}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Inter Tight', system-ui, sans-serif; color: #1C1C1E; background: #F2F2F0">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 250px; overflow: hidden">
    <img src="../images/swim.webp" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%">
    <span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,30,26,0.35) 0%, rgba(20,30,26,0.1) 45%, rgba(242,242,240,0.85) 88%, #F2F2F0 100%)"></span>
    <div style="position: absolute; left: 24px; right: 24px; top: 60px; display: flex; flex-direction: column; gap: 4px; color: #FFFFFF">
      <span style="font-size: 13px; font-weight: 500">Wednesday 25 November</span>
      <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 34px; line-height: 1.1; font-weight: 400">Daily habits.</h1>
    </div>
  </div>

  <div style="position: relative; padding: 188px 20px 0; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 12px 20px; border-radius: 24px; background: #FFFFFF">
      <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 13px; color: #6E6E73">Steps · goal 8,000–10,000</span><span style="font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums">6,240</span></div>
      <span style="height: 40px; padding: 0 14px; border-radius: 20px; background: #F1F1EF; display: flex; align-items: center; font-size: 13px; font-weight: 600">From Health</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 12px 20px; border-radius: 24px; background: #FFFFFF">
      <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 13px; color: #6E6E73">Water · goal 3–4 L</span><span style="font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums">{{ litres }} L · {{ bottles }} bottles</span></div>
      <button type="button" aria-label="Add one 750 ml bottle" onClick="{{ addBottle }}" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #1C1C1E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 12px 20px; border-radius: 24px; background: #FFFFFF">
      <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 13px; color: #6E6E73">Sleep · goal 7–8 h, quality first</span><span style="font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums">7h 20m</span></div>
      <button type="button" aria-label="Sleep quality, tap to change" onClick="{{ cycleSleep }}" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #F1F1EF; color: #1C1C1E; font-size: 13px; font-weight: 600; cursor: pointer">{{ sleepQ }}</button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 12px 20px; border-radius: 24px; background: #FFFFFF">
      <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 13px; color: #6E6E73">Recovery · soreness or tightness</span><span style="font-size: 17px; font-weight: 500">{{ sore }}</span></div>
      <button type="button" onClick="{{ cycleSore }}" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #F1F1EF; color: #1C1C1E; font-size: 13px; font-weight: 600; cursor: pointer">Change</button>
    </div>

    <section aria-label="Fuelling" style="margin-top: 4px; padding: 14px 20px 8px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 4px">
        <span style="font-size: 13px; color: #6E6E73">Fuelling · no calorie target</span>
        <span style="font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums">{{ fuelCount }} of 5</span>
      </div>
      <sc-for list="{{ fuel }}" as="f" hint-placeholder-count="5">
        <button type="button" role="checkbox" aria-checked="{{ f.checked }}" onClick="{{ f.toggle }}" style="display: flex; align-items: center; gap: 12px; min-height: 36px; padding: 0; border: none; background: transparent; color: #1C1C1E; font-size: 15px; text-align: left; cursor: pointer">
          <span style="{{ f.box }}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>{{ f.label }}
        </button>
      </sc-for>
    </section>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 24px; right: 24px; bottom: 20px; height: 64px; border-radius: 32px; background: rgba(255,255,255,0.9); box-shadow: 0 6px 24px rgba(28,28,30,0.10); display: flex; justify-content: space-around; align-items: center">
    <a href="01-today.html" aria-label="Today" style="width: 48px; height: 48px; border-radius: 24px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"/></svg></a>
    <a href="02-workout-overview.html" aria-label="Train" style="width: 48px; height: 48px; border-radius: 24px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 7v10M3 10v4M18 7v10M21 10v4M6 12h12"/></svg></a>
    <a href="07-daily-habits.html" aria-label="Habits" aria-current="page" style="width: 48px; height: 48px; border-radius: 24px; background: #1C1C1E; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg></a>
    <a href="08-strength-progress.html" aria-label="Progress" style="width: 48px; height: 48px; border-radius: 24px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M6 15l4-4 3 3 6-7"/></svg></a>
    <a href="09-check-in.html" aria-label="Check-in" style="width: 48px; height: 48px; border-radius: 24px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { bottles: 2, sleepQ: 0, sore: 1, fuel: { 0: true, 1: true, 2: false, 3: false, 4: true } };
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var sleepOpts = ['Deep sleep', 'OK sleep', 'Broken sleep'];
    var soreOpts = ['No soreness', 'Mild soreness', 'Sore'];
    var labels = ['Protein first at every meal', 'Carbs up, fats in', 'Ate before training', 'Ate after training', 'No skipped meals'];
    var count = 0;
    var fuel = labels.map(function (l, i) {
      var on = !!s.fuel[i];
      if (on) count++;
      return {
        label: l, checked: on ? 'true' : 'false',
        box: 'width: 22px; height: 22px; flex: none; border-radius: 11px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; ' + (on ? 'background: #1C1C1E; color: #FFFFFF;' : 'border: 1.5px solid #B7B5B0; color: transparent;'),
        toggle: function () { var f = Object.assign({}, s.fuel); f[i] = !on; self.setState({ fuel: f }); }
      };
    });
    return {
      bottles: s.bottles,
      litres: (s.bottles * 0.75).toFixed(2).replace(/0$/, ''),
      addBottle: function () { self.setState({ bottles: s.bottles + 1 }); },
      sleepQ: sleepOpts[s.sleepQ],
      cycleSleep: function () { self.setState({ sleepQ: (s.sleepQ + 1) % 3 }); },
      sore: soreOpts[s.sore],
      cycleSore: function () { self.setState({ sore: (s.sore + 1) % 3 }); },
      fuel: fuel,
      fuelCount: count
    };
  }
}
</script>
</body>
</html>
