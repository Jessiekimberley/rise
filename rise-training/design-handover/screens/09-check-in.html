<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coach check-in</title>
<script src="./dc-lite.js"></script>
<style>html,body{margin:0;background:#2b2b2d;min-height:100vh;display:flex;align-items:center;justify-content:center}.dc-root{border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter Tight',system-ui,sans-serif;color:#1C1C1E}
a{color:#1C1C1E;text-decoration:none}a:hover{color:#000000}
button,textarea{font-family:inherit}
textarea::placeholder{color:#8A8A8E}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Inter Tight', system-ui, sans-serif; color: #1C1C1E; background: radial-gradient(95% 26% at 50% 20%, #F6CFB2 0%, rgba(246,207,178,0) 72%), linear-gradient(180deg, #C9D6E8 0%, #E1E7F0 22%, #F2F2F0 46%, #F2F2F0 100%)">
  <div style="padding: 60px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 4px; margin: 0 4px">
      <span style="font-size: 13px; font-weight: 500; color: #4A4A4F">Wednesday 25 November</span>
      <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 32px; line-height: 1.1; font-weight: 400; letter-spacing: -0.01em">Check-in. <span style="color: #6E6E73">For Brenna.</span></h1>
    </div>

    <div role="radiogroup" aria-label="Check-in type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 26px; background: rgba(255,255,255,0.6)">
      <sc-for list="{{ kinds }}" as="k" hint-placeholder-count="2">
        <button type="button" role="radio" aria-checked="{{ k.checked }}" onClick="{{ k.pick }}" style="{{ k.style }}">{{ k.label }}</button>
      </sc-for>
    </div>

    <section style="padding: 16px 20px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; color: #6E6E73">From your logs · {{ range }}</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 10px; column-gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; color: #6E6E73">Strength</span><span style="font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums">{{ sessions }}</span></div>
        <div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; color: #6E6E73">Avg steps</span><span style="font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums">8,410</span></div>
        <div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; color: #6E6E73">Avg water</span><span style="font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums">3.1 L</span></div>
        <div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; color: #6E6E73">Avg sleep</span><span style="font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums">7h 12m</span></div>
      </div>
    </section>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <label style="display: flex; flex-direction: column; gap: 4px; padding: 12px 20px; border-radius: 24px; background: #FFFFFF">
        <span style="font-size: 13px; color: #6E6E73">Wins</span>
        <textarea rows="2" style="resize: none; padding: 0; border: none; background: transparent; font-size: 15px; line-height: 1.4; color: #1C1C1E">Leg press up to 62.5 kg. Ate before every session.</textarea>
      </label>
      <label style="display: flex; flex-direction: column; gap: 4px; padding: 12px 20px; border-radius: 24px; background: #FFFFFF">
        <span style="font-size: 13px; color: #6E6E73">What's been hard</span>
        <textarea rows="2" placeholder="Training, food, sleep, motivation" style="resize: none; padding: 0; border: none; background: transparent; font-size: 15px; line-height: 1.4; color: #1C1C1E"></textarea>
      </label>
      <label style="display: flex; flex-direction: column; gap: 4px; padding: 12px 20px; border-radius: 24px; background: #FFFFFF">
        <span style="font-size: 13px; color: #6E6E73">Questions for Brenna</span>
        <textarea rows="2" placeholder="Anything you want feedback on" style="resize: none; padding: 0; border: none; background: transparent; font-size: 15px; line-height: 1.4; color: #1C1C1E"></textarea>
      </label>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 98px; display: flex; flex-direction: column; gap: 6px">
    <a href="10-check-in-sent.html" style="height: 60px; border-radius: 30px; background: #1C1C1E; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center">Send to coaching doc</a>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 24px; right: 24px; bottom: 20px; height: 64px; border-radius: 32px; background: rgba(255,255,255,0.9); box-shadow: 0 6px 24px rgba(28,28,30,0.10); display: flex; justify-content: space-around; align-items: center">
    <a href="01-today.html" aria-label="Today" style="width: 48px; height: 48px; border-radius: 24px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"/></svg></a>
    <a href="02-workout-overview.html" aria-label="Train" style="width: 48px; height: 48px; border-radius: 24px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 7v10M3 10v4M18 7v10M21 10v4M6 12h12"/></svg></a>
    <a href="07-daily-habits.html" aria-label="Habits" style="width: 48px; height: 48px; border-radius: 24px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg></a>
    <a href="08-strength-progress.html" aria-label="Progress" style="width: 48px; height: 48px; border-radius: 24px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M6 15l4-4 3 3 6-7"/></svg></a>
    <a href="09-check-in.html" aria-label="Check-in" aria-current="page" style="width: 48px; height: 48px; border-radius: 24px; background: #1C1C1E; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kind: 'Midweek' };
  }
  renderVals() {
    var self = this;
    var seg = 'height: 44px; border-radius: 22px; border: none; font-size: 15px; font-weight: 600; cursor: pointer;';
    var kinds = ['Midweek', 'Weekly'].map(function (k) {
      var on = self.state.kind === k;
      return {
        label: k, checked: on ? 'true' : 'false',
        style: seg + (on ? 'background: #FFFFFF; color: #1C1C1E; box-shadow: 0 1px 4px rgba(28,28,30,0.10);' : 'background: transparent; color: #4A4A4F;'),
        pick: function () { self.setState({ kind: k }); }
      };
    });
    var mid = this.state.kind === 'Midweek';
    return {
      kinds: kinds,
      range: mid ? 'Days 1–3' : 'Days 1–7',
      sessions: mid ? '2 of 2' : '4 of 4'
    };
  }
}
</script>
</body>
</html>
