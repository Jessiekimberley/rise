<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strength progress</title>
<script src="./dc-lite.js"></script>
<style>html,body{margin:0;background:#2b2b2d;min-height:100vh;display:flex;align-items:center;justify-content:center}.dc-root{border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter Tight',system-ui,sans-serif;color:#1C1C1E}
a{color:#1C1C1E;text-decoration:none}a:hover{color:#000000}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Inter Tight', system-ui, sans-serif; color: #1C1C1E; background: radial-gradient(95% 28% at 50% 24%, #F6CFB2 0%, rgba(246,207,178,0) 72%), linear-gradient(180deg, #C9D6E8 0%, #E1E7F0 24%, #F2F2F0 50%, #F2F2F0 100%)">
  <div style="padding: 64px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0 4px; font-family: 'Newsreader', Georgia, serif; font-size: 34px; line-height: 1.1; font-weight: 400; letter-spacing: -0.01em">Strength. <span style="color: #6E6E73">Your heaviest sets over the last 8 weeks.</span></h1>

    <div role="radiogroup" aria-label="Lift" style="display: flex; gap: 6px; margin: 0 -20px; padding: 0 20px; overflow-x: auto">
      <sc-for list="{{ lifts }}" as="l" hint-placeholder-count="4">
        <button type="button" role="radio" aria-checked="{{ l.checked }}" onClick="{{ l.pick }}" style="{{ l.style }}">{{ l.name }}</button>
      </sc-for>
    </div>

    <figure style="margin: 0; padding: 20px; border-radius: 26px; background: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; gap: 32px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 13px; color: #6E6E73">Top set now</span>
          <span style="font-size: 32px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{ now }}<span style="font-size: 15px; color: #6E6E73"> kg</span></span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 13px; color: #6E6E73">Since week 1</span>
          <span style="font-size: 32px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">+{{ gain }}<span style="font-size: 15px; color: #6E6E73"> kg</span></span>
        </div>
      </div>
      <svg role="img" aria-label="{{ chartLabel }}" width="302" height="160" viewBox="0 0 302 160">
        <defs>
          <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6CFB2" stop-opacity="0.7"></stop><stop offset="1" stop-color="#F6CFB2" stop-opacity="0"></stop></linearGradient>
        </defs>
        <line x1="0" y1="16" x2="302" y2="16" stroke="#EEEDEA" stroke-width="1"></line>
        <line x1="0" y1="80" x2="302" y2="80" stroke="#EEEDEA" stroke-width="1"></line>
        <line x1="0" y1="144" x2="302" y2="144" stroke="#EEEDEA" stroke-width="1"></line>
        <polygon points="{{ area }}" fill="url(#fill)"></polygon>
        <polyline points="{{ points }}" fill="none" stroke="#E58F66" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
        <circle cx="{{ lastX }}" cy="{{ lastY }}" r="6" fill="#1C1C1E" stroke="#FFFFFF" stroke-width="3"></circle>
        <text x="0" y="11" font-size="11" fill="#6E6E73">{{ hi }}</text>
        <text x="0" y="139" font-size="11" fill="#6E6E73">{{ lo }}</text>
      </svg>
      <div style="display: flex; justify-content: space-between; font-size: 11px; color: #6E6E73"><span>W1</span><span>W2</span><span>W3</span><span>W4</span><span>W5</span><span>W6</span><span>W7</span><span>W8</span></div>
    </figure>

    <a href="02-workout-overview.html" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 12px 20px; border-radius: 24px; background: #FFFFFF">
      <span style="display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 13px; color: #6E6E73">Next time</span>
        <span style="font-size: 17px; font-weight: 500">{{ next }}</span>
      </span>
      <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 22px; background: #F1F1EF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 24px; right: 24px; bottom: 20px; height: 64px; border-radius: 32px; background: rgba(255,255,255,0.9); box-shadow: 0 6px 24px rgba(28,28,30,0.10); display: flex; justify-content: space-around; align-items: center">
    <a href="01-today.html" aria-label="Today" style="width: 48px; height: 48px; border-radius: 24px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"/></svg></a>
    <a href="02-workout-overview.html" aria-label="Train" style="width: 48px; height: 48px; border-radius: 24px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 7v10M3 10v4M18 7v10M21 10v4M6 12h12"/></svg></a>
    <a href="07-daily-habits.html" aria-label="Habits" style="width: 48px; height: 48px; border-radius: 24px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg></a>
    <a href="08-strength-progress.html" aria-label="Progress" aria-current="page" style="width: 48px; height: 48px; border-radius: 24px; background: #1C1C1E; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M6 15l4-4 3 3 6-7"/></svg></a>
    <a href="09-check-in.html" aria-label="Check-in" style="width: 48px; height: 48px; border-radius: 24px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lift: 'Leg Press' };
  }
  renderVals() {
    var self = this;
    var data = {
      'Leg Press': { v: [50, 52.5, 55, 55, 57.5, 60, 60, 62.5], next: 'Day 1 · Lower body' },
      'Back squat': { v: [30, 32.5, 32.5, 35, 35, 37.5, 40, 40], next: 'Day 4 · Lower body' },
      'Lat pulldown': { v: [30, 30, 32.5, 32.5, 35, 35, 35, 37.5], next: 'Day 2 · Upper body' },
      'Shoulder press': { v: [7, 7, 8, 8, 8, 9, 9, 10], next: 'Day 5 · Upper body' }
    };
    var cur = data[this.state.lift];
    var v = cur.v;
    var lo = Math.min.apply(null, v), hi = Math.max.apply(null, v);
    var pad = (hi - lo) * 0.15 || 1;
    var a = lo - pad, b = hi + pad;
    var pts = v.map(function (y, i) {
      var x = 6 + i * (290 / 7);
      var py = 144 - ((y - a) / (b - a)) * 128;
      return [x.toFixed(1), py.toFixed(1)];
    });
    var line = pts.map(function (p) { return p.join(','); }).join(' ');
    var chip = 'height: 40px; padding: 0 16px; flex: none; border-radius: 20px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;';
    var lifts = Object.keys(data).map(function (n) {
      var on = self.state.lift === n;
      return {
        name: n, checked: on ? 'true' : 'false',
        style: chip + (on ? 'background: #1C1C1E; color: #FFFFFF;' : 'background: #FFFFFF; color: #1C1C1E;'),
        pick: function () { self.setState({ lift: n }); }
      };
    });
    var fmt = function (n) { return n % 1 === 0 ? String(n) : n.toFixed(1); };
    return {
      lifts: lifts,
      now: fmt(v[v.length - 1]),
      gain: fmt(v[v.length - 1] - v[0]),
      points: line,
      area: pts[0][0] + ',144 ' + line + ' ' + pts[pts.length - 1][0] + ',144',
      lastX: pts[pts.length - 1][0],
      lastY: pts[pts.length - 1][1],
      hi: fmt(hi) + ' kg', lo: fmt(lo) + ' kg',
      chartLabel: this.state.lift + ' top set rising from ' + fmt(v[0]) + ' to ' + fmt(v[v.length - 1]) + ' kg over 8 weeks',
      next: cur.next
    };
  }
}
</script>
</body>
</html>
