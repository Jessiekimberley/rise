<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today</title>
<script src="./dc-lite.js"></script>
<style>html,body{margin:0;background:#2b2b2d;min-height:100vh;display:flex;align-items:center;justify-content:center}.dc-root{border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter Tight',system-ui,sans-serif;color:#1C1C1E}
a{color:#1C1C1E;text-decoration:none}a:hover{color:#000000}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Inter Tight', system-ui, sans-serif; color: #1C1C1E; background: radial-gradient(95% 34% at 50% 30%, #F6CFB2 0%, rgba(246,207,178,0) 72%), linear-gradient(180deg, #C9D6E8 0%, #E1E7F0 30%, #F2F2F0 58%, #F2F2F0 100%)">
  <div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">JP</span>
      <a href="09-check-in.html" aria-label="Check-in" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></a>
    </div>

    <h1 style="margin: 4px 4px 0; font-family: 'Newsreader', Georgia, serif; font-size: 28px; line-height: 1.14; font-weight: 400; letter-spacing: -0.01em; color: #1C1C1E">{{ lead }} <span style="color: #6E6E73">{{ sub }}</span></h1>

    <a href="{{ heroHref }}" style="position: relative; height: 196px; border-radius: 26px; overflow: hidden; display: block; color: #FFFFFF; background: #1C1C1E">
      <img src="../images/glass.webp" alt="" style="{{ img1 }}">
      <img src="../images/shoulder.webp" alt="" style="{{ img2 }}">
      <img src="../images/swim.webp" alt="" style="{{ img3 }}">
      <img src="../images/liquid.webp" alt="" style="{{ img4 }}">
      <img src="../images/blur.webp" alt="" style="{{ img5 }}">
      <img src="../images/thermal.webp" alt="" style="{{ img6 }}">
      <img src="../images/night.webp" alt="" style="{{ img7 }}">
      <span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,10,8,0) 30%, rgba(12,10,8,0.6) 100%)"></span>
      <span style="position: absolute; left: 20px; bottom: 18px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.92)">{{ tag }}</span>
        <span style="font-family: 'Newsreader', Georgia, serif; font-size: 32px; line-height: 1; color: #FFFFFF">{{ title }}</span>
      </span>
      <span aria-hidden="true" style="position: absolute; right: 16px; bottom: 16px; width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="padding: 14px 16px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; padding: 0 4px">
          <span style="font-size: 13px; color: #6E6E73">This week · tap a day to preview</span>
          <span style="font-size: 13px; font-weight: 600">0 of 4 strength</span>
        </div>
        <div role="radiogroup" aria-label="Programme day" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
          <sc-for list="{{ week }}" as="d" hint-placeholder-count="7">
            <button type="button" role="radio" aria-checked="{{ d.checked }}" aria-label="{{ d.aria }}" onClick="{{ d.pick }}" style="{{ d.style }}"><span style="font-size: 13px; font-weight: 600">{{ d.letter }}</span><span style="font-size: 10px; opacity: 0.75">{{ d.n }}</span></button>
          </sc-for>
        </div>
      </div>
      <a href="07-daily-habits.html" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 14px 20px; border-radius: 24px; background: #FFFFFF">
        <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #6E6E73">Steps</span><span style="font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums">6,240</span><span style="height: 3px; border-radius: 2px; background: #ECEBE8"><span style="display: block; width: 78%; height: 3px; border-radius: 2px; background: #E58F66"></span></span></span>
        <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #6E6E73">Water</span><span style="font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums">1.5 L</span><span style="height: 3px; border-radius: 2px; background: #ECEBE8"><span style="display: block; width: 50%; height: 3px; border-radius: 2px; background: #E58F66"></span></span></span>
        <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #6E6E73">Sleep</span><span style="font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums">7h 20m</span><span style="height: 3px; border-radius: 2px; background: #ECEBE8"><span style="display: block; width: 100%; height: 3px; border-radius: 2px; background: #E58F66"></span></span></span>
      </a>
    </div>
  </div>

  <a href="{{ ctaHref }}" style="position: absolute; left: 20px; right: 20px; bottom: 100px; height: 60px; border-radius: 30px; background: #1C1C1E; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{ cta }}</a>

  <nav aria-label="Main" style="position: absolute; left: 24px; right: 24px; bottom: 20px; height: 64px; border-radius: 32px; background: rgba(255,255,255,0.9); box-shadow: 0 6px 24px rgba(28,28,30,0.10); display: flex; justify-content: space-around; align-items: center">
    <a href="01-today.html" aria-label="Today" aria-current="page" style="width: 48px; height: 48px; border-radius: 24px; background: #1C1C1E; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"/></svg></a>
    <a href="02-workout-overview.html" aria-label="Train" style="width: 48px; height: 48px; border-radius: 24px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 7v10M3 10v4M18 7v10M21 10v4M6 12h12"/></svg></a>
    <a href="07-daily-habits.html" aria-label="Habits" style="width: 48px; height: 48px; border-radius: 24px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg></a>
    <a href="08-strength-progress.html" aria-label="Progress" style="width: 48px; height: 48px; border-radius: 24px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M6 15l4-4 3 3 6-7"/></svg></a>
    <a href="09-check-in.html" aria-label="Check-in" style="width: 48px; height: 48px; border-radius: 24px; color: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: 1 };
  }
  renderVals() {
    var self = this;
    var today = 1;
    var days = {
      1: { letter: 'L', title: 'Lower body', kind: 'strength', sub: 'Leg press, RDL, leg extensions, walking lunges, plank. Sixteen sets.' },
      2: { letter: 'U', title: 'Upper body', kind: 'strength', sub: 'Lat pulldown, cable row, hammer curl, tricep pushdown, lateral raises.' },
      3: { letter: 'R', title: 'Active rest', kind: 'rest', sub: 'Still hit your steps. Stretch or roll if tight, then journal and plan ahead.' },
      4: { letter: 'L', title: 'Lower body', kind: 'strength', sub: 'Back squat, hamstring curl, Bulgarian split squat, calf raises, leg raises.' },
      5: { letter: 'U', title: 'Upper body', kind: 'strength', sub: 'Shoulder press, chest press, overhead tricep extension, rear delts, Russian twists.' },
      6: { letter: 'C', title: 'Cardio', kind: 'cardio', sub: 'Outdoors on nice days. 45–60 min walk, hike or cycle, or yoga, pilates, a swim.' },
      7: { letter: 'R', title: 'Active rest', kind: 'rest', sub: 'Still hit your steps. Stretch or roll if tight, then journal and plan ahead.' }
    };
    var d = this.state.day;
    var cur = days[d];
    var isToday = d === today;
    var hidden = 'position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.35s ease;';
    var shown = 'position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 1; transition: opacity 0.35s ease;';
    var vals = {};
    for (var i = 1; i <= 7; i++) vals['img' + i] = i === d ? shown : hidden;
    var base = 'height: 44px; border-radius: 16px; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; cursor: pointer; padding: 0;';
    vals.week = Object.keys(days).map(function (k) {
      var n = Number(k);
      var on = n === d;
      var strength = days[k].kind === 'strength';
      return {
        letter: days[k].letter, n: n === today ? 'Today' : 'D' + n,
        checked: on ? 'true' : 'false',
        aria: 'Day ' + n + ', ' + days[k].title,
        style: base + (on ? 'background: #1C1C1E; color: #FFFFFF;' : strength ? 'background: #F1F1EF; color: #1C1C1E;' : 'background: transparent; color: #4A4A4F; box-shadow: inset 0 0 0 1px #E2E1DD;'),
        pick: function () { self.setState({ day: n }); }
      };
    });
    vals.lead = isToday ? 'Morning, Jessie.' : 'Day ' + d + ' preview.';
    vals.sub = cur.sub;
    vals.tag = (isToday ? 'Today · ' : '') + 'Day ' + d;
    vals.title = cur.title;
    vals.heroHref = cur.kind === 'strength' ? 'Workout.dc.html' : 'Habits.dc.html';
    vals.ctaHref = vals.heroHref;
    vals.cta = cur.kind === 'strength' ? (isToday ? 'Start workout' : 'Preview session') : cur.kind === 'cardio' ? 'Log cardio in habits' : 'Open daily habits';
    return vals;
  }
}
</script>
</body>
</html>
