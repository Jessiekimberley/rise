<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rest timer</title>
<script src="./dc-lite.js"></script>
<style>html,body{margin:0;background:#2b2b2d;min-height:100vh;display:flex;align-items:center;justify-content:center}.dc-root{border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter Tight',system-ui,sans-serif;color:#FFFFFF}
a{color:#FFFFFF;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Inter Tight', system-ui, sans-serif; color: #FFFFFF; background: #0E1412">
  <img src="../images/night.webp" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
  <span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,12,11,0.55) 0%, rgba(8,12,11,0.25) 40%, rgba(8,12,11,0.75) 100%)"></span>

  <div style="position: relative; padding: 52px 20px 0; display: flex; flex-direction: column; align-items: center">
    <div style="width: 100%; display: flex; justify-content: space-between; align-items: center">
      <a href="03-log-set.html" aria-label="Back to sets" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
      <span style="font-size: 14px; color: rgba(255,255,255,0.85)">Leg Press · set 2 logged</span>
      <span style="width: 44px"></span>
    </div>

    <span style="margin-top: 52px; font-family: 'Newsreader', Georgia, serif; font-size: 28px; color: rgba(255,255,255,0.92)">Breathe. Rest.</span>

    <div style="position: relative; width: 272px; height: 272px; margin-top: 18px">
      <svg aria-hidden="true" width="272" height="272" viewBox="0 0 272 272" style="position: absolute; inset: 0; transform: rotate(-90deg)">
        <circle cx="136" cy="136" r="124" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4"></circle>
        <circle cx="136" cy="136" r="124" fill="none" stroke="#F6CFB2" stroke-width="4" stroke-linecap="round" stroke-dasharray="779.11" stroke-dashoffset="{{ offset }}"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
        <span role="timer" aria-live="off" style="font-size: 76px; font-weight: 400; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">{{ clock }}</span>
        <span style="font-size: 14px; color: rgba(255,255,255,0.8)">of 2:00</span>
      </div>
    </div>

    <div style="display: flex; gap: 12px; margin-top: 24px">
      <button type="button" onClick="{{ minus }}" style="height: 48px; padding: 0 22px; border-radius: 24px; border: none; background: rgba(255,255,255,0.16); color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer">−15 s</button>
      <button type="button" onClick="{{ plus }}" style="height: 48px; padding: 0 22px; border-radius: 24px; border: none; background: rgba(255,255,255,0.16); color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer">+15 s</button>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 14px 20px; border-radius: 24px; background: rgba(255,255,255,0.14); backdrop-filter: blur(18px)">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: rgba(255,255,255,0.8)">Up next · set 3 of 4</span>
        <span style="font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums">62.5 kg × 8</span>
      </div>
      <span style="height: 36px; padding: 0 12px; border-radius: 18px; background: rgba(255,255,255,0.16); display: flex; align-items: center; font-size: 13px; font-variant-numeric: tabular-nums">Last 62.5 × 7</span>
    </div>
    <a href="03-log-set.html" style="height: 60px; border-radius: 30px; background: #FFFFFF; color: #1C1C1E; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center">Skip rest</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { left: 84, total: 120 };
  }
  componentDidMount() {
    var self = this;
    this.t = setInterval(function () {
      self.setState({ left: self.state.left > 0 ? self.state.left - 1 : 84 });
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    var self = this;
    var s = this.state;
    var m = Math.floor(s.left / 60);
    var sec = s.left % 60;
    var frac = Math.min(1, s.left / s.total);
    return {
      clock: m + ':' + (sec < 10 ? '0' : '') + sec,
      offset: (779.11 * (1 - frac)).toFixed(1),
      minus: function () { self.setState({ left: Math.max(0, s.left - 15) }); },
      plus: function () { self.setState({ left: s.left + 15, total: Math.max(s.total, s.left + 15) }); }
    };
  }
}
</script>
</body>
</html>
